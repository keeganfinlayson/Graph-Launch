<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Launch v0.13</title>
<style>
:root{color-scheme:light;--bg:#e8eef2;--ink:#182634;--muted:#667888;--line:#d8e3ea;--card:#ffffff;--accent:#eb6733;--accent-dark:#b8441e;--road:#20a8a4;--road-dark:#234d63;--navy:#163247}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #4a88ff;outline-offset:2px}
.shell{max-width:1500px;margin:auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.title{font-size:clamp(23px,2.2vw,31px);font-weight:900;letter-spacing:-.05em}.version{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:800;color:#627482}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:14px;align-items:stretch;flex:1}.stage,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 5px 24px rgba(29,60,83,.08)}.stage{overflow:hidden;display:flex;flex-direction:column}.stage-top{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e7eef3;background:#fcfeff}.track-label{font-size:13px;font-weight:900;letter-spacing:.03em}.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#4f6677}.dot{width:8px;height:8px;border-radius:50%;background:#59c899;box-shadow:0 0 0 3px #d8f4e8}.status.go .dot{background:#f2ab37;box-shadow:0 0 0 3px #fff1cf}.status.done .dot{background:#4b7fee;box-shadow:0 0 0 3px #dce8ff}.canvas-box{position:relative;min-height:max(560px,calc(100dvh - 155px));background:linear-gradient(#ecf7ff,#fcfdf8);flex:1}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:14px;top:12px;background:rgba(255,255,255,.9);border:1px solid #dbe6ed;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;color:#486172;pointer-events:none}.scorebox{position:absolute;right:14px;top:12px;background:#163247;color:#fff;border-radius:12px;padding:8px 12px;min-width:122px;text-align:right;box-shadow:0 6px 16px rgba(18,42,58,.24);pointer-events:none}.scorebox .k{font-size:10px;font-weight:800;letter-spacing:.12em;color:#bcd8e8;text-transform:uppercase}.scorebox .v{font-size:24px;font-weight:900;letter-spacing:-.06em;margin-top:2px;font-variant-numeric:tabular-nums}.scorebox .u{font-size:12px;color:#c9dde7;font-weight:700}.panel{padding:16px;display:flex;flex-direction:column;gap:14px}.expr{display:flex;align-items:center;gap:8px;border:2px solid #dce6ed;border-radius:13px;padding:11px 12px;background:#f4f8fb}.expr:focus-within{border-color:#4c7de9;background:#fff}.expr span{font-size:20px;font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:900;color:#28495a;white-space:nowrap}.expr input{border:0;background:transparent;outline:0;width:100%;min-width:0;font-size:18px;font-weight:800;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#142a3c}.error{display:none;font-size:12px;font-weight:800;color:#a43b27;background:#fff1eb;border:1px solid #f3c2b3;padding:8px 10px;border-radius:10px;line-height:1.35}.error.show{display:block}.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{border:1.5px solid #dfe8ee;background:#f7fafc;color:#325062;border-radius:11px;padding:10px 8px;text-align:left;font-size:12px;font-weight:800}.chip small{display:block;font-size:11px;color:#688093;font-weight:700;margin-top:3px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.chip:hover{background:#edf5ff;border-color:#8bb2ec}.chip.active{background:#eaf2ff;border-color:#5088ea}.actions{display:grid;grid-template-columns:1fr auto;gap:8px}.launch{height:48px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 var(--accent-dark)}.launch:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-dark)}.launch:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}.reset{height:48px;border:1px solid #d9e5ec;background:#f6f9fc;color:#506675;border-radius:12px;padding:0 15px;font-size:13px;font-weight:900}.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini .card{background:#f7fafc;border:1px solid #dfe8ee;border-radius:11px;padding:11px 10px}.mini .label{font-size:11px;font-weight:800;color:#6f8392;margin-bottom:4px}.mini .value{font-size:22px;font-weight:900;letter-spacing:-.05em;color:#1e374a;font-variant-numeric:tabular-nums}.foot{font-size:11px;font-weight:700;color:#738693;text-align:center}.foot em{font-style:normal;color:#3d6073}
@media (max-width:900px){.layout{grid-template-columns:1fr}.canvas-box{min-height:max(430px,calc(100dvh - 155px))}}@media (max-width:520px){.canvas-box{min-height:360px}.shell{padding:10px}.top{margin-bottom:10px}.stage-top{padding:0 12px}.canvas-box{min-height:360px}.hud{left:8px;top:8px;padding:5px 7px;font-size:11px}.scorebox{right:8px;top:8px;padding:7px 9px;min-width:95px}.scorebox .v{font-size:20px}.panel{padding:12px}.expr input{font-size:16px}}
.scorebox{min-width:144px}.scorebox .best-line{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;margin-top:9px;padding-top:7px;border-top:1px solid rgba(219,236,247,.25);font-size:11px;color:#c7dce8;font-variant-numeric:tabular-nums}.scorebox .best-line span:first-child{font-size:9px;font-weight:900;letter-spacing:.1em;margin-right:auto}.scorebox .best-line strong{font-size:14px;font-weight:900;color:#fff}.scorebox .best-line span:last-child{font-size:10px}
@media(max-width:520px){.scorebox{min-width:120px}.scorebox .best-line{gap:4px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="title">Graph Launch</div>
    <div class="version">v0.13</div>
  </header>
  <main class="layout">
    <section class="stage" aria-label="Animated graph launch simulation">
      <div class="stage-top">
        <div class="track-label">TRACK · x ≤ 0</div>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">READY</span></div>
      </div>
      <div class="canvas-box" id="canvasBox">
        <canvas id="scene" role="img" aria-label="A sleek sports car driving on a function graph, launching into a garbage dump, and aiming for the best-distance marker"></canvas>
        
        <div class="scorebox" aria-live="polite">
          <div class="k">Distance</div>
          <div class="v" id="scoreText">—</div>
          <div class="u" id="scoreUnits">ft</div>
          <div class="best-line"><span>BEST</span><strong id="bestText">—</strong><span>ft</span></div>
        </div>
      </div>
    </section>
    <aside class="panel" aria-label="Controls">
      <label class="expr" for="expression"><span>f(x) =</span><input id="expression" type="text" value="0.5x + 2" autocomplete="off" spellcheck="false" placeholder="use ^ for powers"></label>
      <div class="error" id="error" role="alert"></div>
      <div class="chips" id="chips">
        <button class="chip active" data-expression="0.5x + 2">line<small>0.5x + 2</small></button>
        <button class="chip" data-expression="x">steep<small>x</small></button>
        <button class="chip" data-expression="(x+4)^2/8">curve<small>(x+4)^2/8</small></button>
        <button class="chip" data-expression="sin(x)+1.2">wave<small>sin(x)+1.2</small></button>
      </div>
      <div class="actions">
        <button class="launch" id="go"><span id="goLabel">Launch</span></button>
        <button class="reset" id="reset">Reset</button>
      </div>

      
    </aside>
  </main>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const canvas=$('scene'),box=$('canvasBox'),ctx=canvas.getContext('2d');

const PI=Math.PI,G=19,TRACK_START=-20,TRACK_END=0,DROP=3.5,WHEEL=.34,BASE_LAUNCH_SPEED=15.5,DRIVE_MIN=2.4,DRIVE_MAX=13.8;
const BEST_KEY='graph-launch-personal-best-ft';
let bestDistance=null;
try{const saved=Number(localStorage.getItem(BEST_KEY));if(Number.isFinite(saved)&&saved>=0&&localStorage.getItem(BEST_KEY)!==null)bestDistance=saved;}catch(_e){}
function showBest(){bestText.textContent=bestDistance===null?'—':bestDistance.toFixed(2);}
function commitScore(){score=Math.max(0,car.x);scoreText.textContent=score.toFixed(2);if(bestDistance===null||score>bestDistance){bestDistance=score;try{localStorage.setItem(BEST_KEY,String(bestDistance));}catch(_e){}}showBest();setStatus();}
showBest();
const FNS={sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,abs:Math.abs,sqrt:Math.sqrt,exp:Math.exp,ln:Math.log,log:Math.log10,floor:Math.floor,ceil:Math.ceil,round:Math.round,sign:Math.sign};
const OPS={'+':1,'-':1,'*':1,'/':1,'^':1};
function tokenize(raw){
 const s=raw.trim().replace(/π/g,'pi').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');
 if(!s)throw Error('Enter a function.');
 let t=[],i=0;
 while(i<s.length){if(/\s/.test(s[i])){i++;continue;}
  const n=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);if(n){t.push({type:'num',value:Number(n[0])});i+=n[0].length;continue;}
  const id=s.slice(i).match(/^[a-zA-Z]+/);if(id){const name=id[0].toLowerCase();if(!(name in FNS)&&!['x','pi','e'].includes(name))throw Error('Unknown name: '+id[0]);t.push({type:'id',value:name});i+=id[0].length;continue;}
  if(OPS[s[i]]||s[i]==='('||s[i]===')'){t.push({type:s[i],value:s[i]});i++;continue;}
  throw Error('Unexpected character: '+s[i]);
 }
 let result=[];
 for(const cur of t){const prev=result[result.length-1];const prevEnd=prev&&(prev.type==='num'||prev.type===')'||prev.type==='id'&&!(prev.value in FNS));const nextStart=cur.type==='num'||cur.type==='('||cur.type==='id';if(prevEnd&&nextStart)result.push({type:'*',value:'*'});result.push(cur);}
 return result;
}
function parse(raw){const toks=tokenize(raw);let p=0;const peek=()=>toks[p]?.type,take=()=>toks[p++];
 function atom(){const a=take();if(!a)throw Error('Incomplete expression.');if(a.type==='num')return()=>a.value;
  if(a.type==='id'){if(a.value==='x')return x=>x;if(a.value==='pi')return()=>PI;if(a.value==='e')return()=>Math.E;
   if(peek()!=='(')throw Error(a.value+' needs parentheses.');take();const arg=sum();if(peek()!==')')throw Error('Missing ).');take();return x=>FNS[a.value](arg(x));}
  if(a.type==='('){const val=sum();if(peek()!==')')throw Error('Missing ).');take();return val;}
  throw Error('Expected a number, x, or ( ... ).');
 }
 function power(){let left=atom();if(peek()==='^'){take();const right=unary(),a=left;left=x=>Math.pow(a(x),right(x));}return left;}
 function unary(){if(peek()==='+'){take();return unary();}if(peek()==='-'){take();const v=unary();return x=>-v(x);}return power();}
 function product(){let left=unary();while(peek()==='*'||peek()==='/'){const op=take().type,right=unary(),a=left;left=op==='*'?(x=>a(x)*right(x)):(x=>a(x)/right(x));}return left;}
 function sum(){let left=product();while(peek()==='+'||peek()==='-'){const op=take().type,right=product(),a=left;left=op==='+'?(x=>a(x)+right(x)):(x=>a(x)-right(x));}return left;}
 const f=sum();if(p!==toks.length)throw Error('Check the expression near '+(toks[p]?.value||'the end')+'.');return f;
}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function neat(n,d=1){return Math.abs(n)<.0005?'0':n.toFixed(d).replace(/\.?0+$/,'');}
function sq(n){return n*n;}
function smoothstep(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}

let state='idle',frameNo=0,lastTime=0,elapsed=0,particles=[],physicsRemainder=0;
const PHYSICS_DT=1/120;
let car={x:-15,y:0,rot:0,omega:0,vx:0,vy:0,trackS:0,trackV:8.3,wspin:0,bounces:0,slideVx:0,entering:true,settleT:0,impactT:0,susp:[0,0],bounceRestitution:.4,bounceGrip:.9,bounceTwist:0,slideDrag:3.7};
const clearStatus=()=>{statusEl.className='status';statusText.textContent='READY';};
function setStatus(){statusEl.className='status'+(state==='rest'?' done':state==='idle'?'':' go');statusText.textContent=state==='rest'?'DONE':state==='drive'?'DRIVING':state==='flight'?'AIRBORNE':state==='bounce'?'BOUNCING':state==='slide'?'SLIDING':'READY';}
function efficiency(angle){const a=Math.abs(angle*180/PI);if(a<=45)return 1;if(a>=89)return .015;return clamp(1-.985*Math.pow((a-45)/44,1.45),.015,1);}
function calcSlope(x){const h=.003,b=Math.max(TRACK_START,x-h),t=Math.min(0,x+h);return (fn(t)-fn(b))/(t-b||1);}
function trackAt(s){let lo=0,hi=samples.length-1;while(lo<hi){const m=(lo+hi)>>1;if(samples[m].s<s)lo=m+1;else hi=m;}const b=samples[lo],a=samples[Math.max(0,lo-1)];if(lo===0)return{x:b.x,y:b.y};const t=clamp((s-a.s)/(b.s-a.s||1),0,1);return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)};}
// Convert a world x position into arc length on the sampled track.
function trackDistanceAtX(x){
 let lo=0,hi=samples.length-1;
 while(lo<hi){const m=(lo+hi)>>1;if(samples[m].x<x)lo=m+1;else hi=m;}
 if(lo===0)return samples[0].s;
 const a=samples[lo-1],b=samples[lo],t=clamp((x-a.x)/(b.x-a.x||1),0,1);
 return lerp(a.s,b.s,t);
}
function gaussian(x,center,width){return Math.exp(-Math.pow((x-center)/width,2));}
// Broad, gently undulating junkyard landing field. The photographed surface is flat
// across the long landing zone; collision elevations are placed near that visual crest.
function pileSurface(x){
 if(x<0)return groundBase+6.35;
 const s=6.35+.28*gaussian(x,16,16)+.48*gaussian(x,49,21)+.15*gaussian(x,72,17)
   +.045*Math.sin(x*.38)*Math.sin(x*.15+.6);
 return groundBase+s;
}
function pileSlope(x){const d=.08;return (pileSurface(x+d)-pileSurface(x-d))/(2*d);}
function validate(expr){
 const calc=parse(expr),n=650,dx=(TRACK_END-TRACK_START)/n,pts=[];let total=0,min=Infinity,max=-Infinity,prev=null;
 for(let i=0;i<=n;i++){
  const x=TRACK_START+i*dx,y=calc(x);
  if(!Number.isFinite(y)||Math.abs(y)>100000)throw Error('Function undefined along the driving path.');
  if(prev){total+=Math.hypot(dx,y-prev.y);}pts.push({x,y,s:total});min=Math.min(min,y);max=Math.max(max,y);prev={x,y};
 }
 for(let i=1;i<n;i++){const d1=pts[i].y-pts[i-1].y,d2=pts[i+1].y-pts[i].y;if(Math.abs(d1)>35&&Math.abs(d2)>35&&d1*d2<0)throw Error('Track appears discontinuous.');}
 const m=(calc(0)-calc(-.0005))/.0005;if(!Number.isFinite(m)||Math.abs(m)>500)throw Error('The curve is too steep at x = 0.');
 if(Math.abs(calc(0)-calc(-.004))>40)throw Error('Track changes too sharply at the end.');
 return{calc,pts,total,min,max,y0:calc(0),m};

function syncPreset(){document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.expression.replaceAll(' ','')===field.value.trim().replaceAll(' ','')));}
function reset(){
 // Start on the function just beyond the left edge, never on a horizontal approach.
 state='idle';car={x:startTrackX,y:fn(startTrackX)+WHEEL_RADIUS,rot:Math.atan(calcSlope(startTrackX)),omega:0,vx:0,vy:0,trackS:startTrackS,trackV:8.3,wspin:0,bounces:0,slideVx:0,entering:false,settleT:0,impactT:0,susp:[0,0],bounceRestitution:.4,bounceGrip:.9,bounceTwist:0,slideDrag:3.7};
 // A small amount of surface-friction variation is chosen once per run.
 car.slideDrag=3.45+Math.random()*.50;
 particles=[];score=null;landingX=null;elapsed=0;physicsRemainder=0;view.left=view.baseLeft;view.midY=view.baseMidY;scoreText.textContent='—';scoreUnits.textContent='ft';goLabel.textContent='Launch';setStatus();
}
function refresh(shouldReset=true){try{
 const d=validate(field.value);
 if(d.y0 <= JUNKYARD_BASE_Y+6.35+WHEEL_RADIUS+0.5){
  throw Error('The launch point is below the junkyard. Raise the function.');
 }
 fn=d.calc;samples=d.pts;roadLength=d.total;endY=d.y0;endSlope=d.m;sceneMin=d.min;sceneMax=d.max;launchEff=efficiency(Math.atan(endSlope));
 // Fixed pixels per graph unit: never zoom out to fit a steep function.
 view.baseLeft=-12.4;
 view.ppu=clamp(view.w/26.5,19,36);
 startTrackX=clamp(view.baseLeft-1.45,TRACK_START+.25,-.75);
 startTrackS=trackDistanceAtX(startTrackX);
 // Frame the left edge of the plotted function, not the full y-range.
 // The car will enter from offscreen and the camera will take over at the edge.
 view.baseMidY=fn(view.baseLeft+.45)+.3;
 photoHeight=photoWidth*(724/2172);
 // The junkyard is a permanent part of the world. Its surface and image stay
 // fixed at the same coordinates regardless of function, camera or launch height.
 groundBase=JUNKYARD_BASE_Y;
 go.disabled=false;error.classList.remove('show');error.textContent='';syncPreset();if(shouldReset)reset();return true;
 }catch(ex){error.textContent=ex.message||'Invalid function.';error.classList.add('show');go.disabled=true;if(fn&&samples.length)reset();return false;}}
function start(){if(!refresh(true))return;state='drive';goLabel.textContent='Replay';setStatus();}
function puff(x,y,n=15,kind='dust'){
 for(let i=0;i<n;i++){const theta=Math.random()*2*PI,s=.65+Math.random()*4.4;
 particles.push({x,y,vx:Math.cos(theta)*s,vy:Math.sin(theta)*s+1.9,r:.03+Math.random()*.12,life:.45+Math.random()*.85,kind});}
 if(particles.length>180)particles.splice(0,particles.length-180);
}
// Ground-contact geometry: front and rear wheels independently test the pile.
function wheelLocation(side){const px=car.x+side*AXLE*Math.cos(car.rot),py=car.y+side*AXLE*Math.sin(car.rot);return{x:px,y:py-WHEEL_RADIUS};}
function driveSubstep(dt){

 car.trackV=clamp(car.trackV+accel*dt,.6,TOP_SPEED);
 // The active run begins just offscreen, not at the distant sample origin.
 car.trackS=Math.min(roadLength,car.trackS+Math.max(car.trackV,(roadLength-startTrackS)/5.0)*dt);
 const p=trackAt(car.trackS);

function airborneSubstep(dt){
 car.x+=car.vx*dt;car.y+=car.vy*dt-.5*GRAVITY*dt*dt;car.vy-=GRAVITY*dt;
 const flightAngle=Math.atan2(car.vy,Math.max(.1,car.vx));

 car.impactT=Math.max(0,car.impactT-dt);
 let best=null;
 for(const side of [-1,1]){const w=wheelLocation(side);if(w.x<0)continue;
  const penetration=pileSurface(w.x)-w.y;
  if(penetration>0&&(!best||penetration>best.penetration))best={side,x:w.x,penetration};}
 if(best){
  car.y+=best.penetration+.016;
  const s=pileSlope(best.x),den=Math.hypot(-s,1),nx=-s/den,ny=1/den;

  const contactVy=car.vy+car.omega*lever*Math.cos(car.rot);
  const approach=contactVx*nx+contactVy*ny;
  if(approach<-.12){
   const newImpact=car.impactT<=0;
   if(newImpact){
    car.bounces++;
    if(landingX==null)landingX=best.x;
    puff(best.x,pileSurface(best.x),22,'junk');
    car.impactT=.16;

    // Store these values for the duration of the contact; never reroll per frame.
    const baseRestitution=car.bounces===1?.53:car.bounces===2?.37:car.bounces===3?.24:.14;

function slideSubstep(dt){
 const slope=pileSlope(car.x),surface=pileSurface(car.x);

}
function update(dt){frameNo++;elapsed+=dt;
 if(state==='drive'||state==='flight'||state==='bounce'||state==='slide'){

  // Only ground-contact response varies slightly from run to run.
  physicsRemainder+=dt;
  let n=0;
  while(physicsRemainder+1e-10>=PHYSICS_DT&&n<8){
   physicsRemainder-=PHYSICS_DT;n++;
   if(state==='drive')driveSubstep(PHYSICS_DT);
   else if(state==='flight'||state==='bounce')airborneSubstep(PHYSICS_DT);
   else if(state==='slide')slideSubstep(PHYSICS_DT);

 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=GRAVITY*.33*dt;p.life-=dt;if(p.life<0)particles.splice(i,1);}

 // Horizontal tracking waits until the car approaches the middle of the screen;
 // vertical tracking begins as soon as it enters from the left.
 const visibleWidth=view.w/view.ppu;
 let targetLeft=view.baseLeft;
 if(state==='drive')targetLeft=Math.max(view.baseLeft,car.x-visibleWidth*.44);
 else if(state!=='idle')targetLeft=Math.max(view.baseLeft,car.x-visibleWidth*.43);
 const horizontalRate=state==='drive'?4.2:state==='rest'?2.7:5.2;
 view.left+=(targetLeft-view.left)*(1-Math.exp(-dt*horizontalRate));
 let targetMid=view.baseMidY;
 if(state==='drive'){
  // Keep the first visible part of the curve in frame before the car enters.
  const edge=view.baseLeft+.25;
  if(car.x>edge){
   const blend=smoothstep(edge,edge+1.1,car.x);
   targetMid=lerp(view.baseMidY,car.y+.025*view.h/view.ppu,blend);
  }
 }else if(state==='flight'||state==='bounce'){
  // Place the falling car above center to reveal the approaching dump below.
  targetMid=car.y-.11*view.h/view.ppu;
 }else if(state==='slide'||state==='rest'){

 }
 const verticalRate=state==='drive'?11:state==='flight'||state==='bounce'?9:state==='slide'?6.5:state==='rest'?4.2:3;
 view.midY+=(targetMid-view.midY)*(1-Math.exp(-dt*verticalRate));

const X=x=>(x-view.left)*view.ppu,Y=y=>view.h/2+(view.midY-y)*view.ppu,U=u=>u*view.ppu;
function line(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function sky(){
 // Always paint the entire canvas. The sky photograph is a single continuous
 // layer with gentle camera parallax, so it never reveals empty edges.
 const grad=ctx.createLinearGradient(0,0,0,view.h);
 grad.addColorStop(0,'#2693ed');grad.addColorStop(1,'#93ccf5');
 ctx.fillStyle=grad;ctx.fillRect(0,0,view.w,view.h);
 if(imageSky.complete&&imageSky.naturalWidth){
  const cropW=Math.min(imageSky.naturalWidth,view.w*1.85);
  const cropH=Math.min(imageSky.naturalHeight,view.h*1.85);
  const sx=clamp(540+(view.left-view.baseLeft)*8,0,imageSky.naturalWidth-cropW);
  const sy=clamp(250+(view.baseMidY-view.midY)*3,0,imageSky.naturalHeight-cropH);
  ctx.drawImage(imageSky,sx,sy,cropW,cropH,0,0,view.w,view.h);
 }
}
function grid(){
  // Keep the coordinate plane visible at every camera altitude, including
  // above the curve and over the lower junkyard; do not fade it out on descent.
 ctx.save();ctx.globalAlpha=(state==='idle'||state==='drive')?1:.8;
 const left=Math.floor(view.left),right=view.left+view.w/view.ppu;
 const minY=Math.floor(view.midY-view.h/(2*view.ppu))-1;
 const maxY=Math.ceil(view.midY+view.h/(2*view.ppu))+1;
 // Navy lines remain visible over bright blue sky without obscuring the clouds.
 for(let i=left;i<=right;i++){
  const major=i%5===0;ctx.strokeStyle=major?'rgba(9,48,82,.45)':'rgba(12,54,87,.24)';
  ctx.lineWidth=major?1.4:.85;line(X(i),0,X(i),view.h);
 }
 for(let i=minY;i<=maxY;i++){
  const major=i%5===0;ctx.strokeStyle=major?'rgba(9,48,82,.45)':'rgba(12,54,87,.24)';
  ctx.lineWidth=major?1.4:.85;line(0,Y(i),view.w,Y(i));
 }
 const axisY=Y(0);
 if(axisY>=0&&axisY<=view.h){ctx.strokeStyle='rgba(4,30,55,.85)';ctx.lineWidth=2.0;line(0,axisY,view.w,axisY);}
 if(X(0)>=0&&X(0)<=view.w){ctx.strokeStyle='rgba(4,30,55,.83)';ctx.lineWidth=2.0;line(X(0),0,X(0),view.h);}
 ctx.font='800 12px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 const labelStep=view.ppu<12?10:view.ppu<23?5:2;
 for(let i=Math.ceil(view.left/labelStep)*labelStep;i<right;i+=labelStep){
  const px=X(i),ly=clamp(axisY+19,20,view.h-20),t=String(i);
  ctx.strokeStyle='rgba(240,249,255,.96)';ctx.lineWidth=3.2;ctx.strokeText(t,px,ly);
  ctx.fillStyle='#062943';ctx.fillText(t,px,ly);

function curve(){
 if(!samples.length)return;
  // Plot remains fully opaque even when the camera is high above or below
  // the original viewport; the function itself still ends at x = 0.
  ctx.save();
 ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
 let started=false;const left=Math.min(TRACK_START-2,view.left-1);
 for(let x=left;x<TRACK_START;x+=.025){
  const y=fn(x);if(!Number.isFinite(y)||Math.abs(y)>100000){started=false;continue;}
  if(!started){ctx.moveTo(X(x),Y(y));started=true;}else ctx.lineTo(X(x),Y(y));
 }
 for(const p of samples){if(!started){ctx.moveTo(X(p.x),Y(p.y));started=true;}else ctx.lineTo(X(p.x),Y(p.y));}
 ctx.strokeStyle='#12344d';ctx.lineWidth=8;ctx.stroke();
 ctx.strokeStyle='#ffe27a';ctx.lineWidth=4.3;ctx.stroke();
 ctx.fillStyle='#ffe27a';ctx.strokeStyle='#12344d';ctx.lineWidth=2.5;
 ctx.beginPath();ctx.arc(X(0),Y(endY),5.3,0,2*PI);ctx.fill();ctx.stroke();ctx.restore();
}
// A sky-matted junkyard panorama, repeated in world space. The alpha fades the
// horizon into the same uninterrupted sky as the graph; no rectangular sky patch.
function junkyard(){
 if(!imageDump.complete||!imageDump.naturalWidth)return;
 const yTop=groundBase-5+photoHeight,drawY=Y(yTop),height=U(photoHeight),width=U(photoWidth);
 if(drawY>view.h+20)return;
 const first=Math.floor((view.left-1)/photoWidth)-1;
 const last=Math.ceil((view.left+view.w/view.ppu+1)/photoWidth)+1;
 ctx.save();
 // Underlying ground extends below the panorama, so the lower edge never exposes sky.
 const bottom=drawY+height;
 if(bottom<view.h){
  const soil=ctx.createLinearGradient(0,Math.max(0,bottom-10),0,view.h);
  soil.addColorStop(0,'#564a3a');soil.addColorStop(1,'#302a25');
  ctx.fillStyle=soil;ctx.fillRect(0,Math.max(0,bottom-2),view.w,view.h-Math.max(0,bottom-2));
 }
 for(let tile=first;tile<=last;tile++){
  const px=X(tile*photoWidth);

  ctx.drawImage(imageDump,0,drawY,width,height);

  // stretching a thin strip into obvious streaks below the original photograph.
  if(bottom<view.h){
   const stripPx=155,stripH=height*stripPx/imageDump.naturalHeight;
   const srcY=imageDump.naturalHeight-stripPx;
   const bands=Math.min(12,Math.ceil((view.h-bottom)/stripH));
   for(let band=0;band<bands;band++){
    const destY=bottom+band*stripH;
    ctx.save();
    if(band%2===0){ctx.translate(0,2*destY+stripH);ctx.scale(1,-1);}
    ctx.drawImage(imageDump,0,srcY,imageDump.naturalWidth,stripPx,0,destY,width,stripH);
    ctx.restore();
   }
  }
  ctx.restore();
 }
 // Fade the lower extension into shadow, avoiding a visible mirrored-debris band.
 if(bottom<view.h){
  const shade=ctx.createLinearGradient(0,bottom,0,view.h);
  shade.addColorStop(0,'rgba(29,25,21,0)');
  shade.addColorStop(.5,'rgba(24,22,19,.55)');
  shade.addColorStop(1,'rgba(20,19,17,.93)');
  ctx.fillStyle=shade;ctx.fillRect(0,Math.max(0,bottom),view.w,view.h-Math.max(0,bottom));

}
function wheelCenter(side){return{x:car.x+side*AXLE*Math.cos(car.rot),y:car.y+side*AXLE*Math.sin(car.rot)};}
function sportsCar(){
 const px=X(car.x),py=Y(car.y);if(px<-140||px>view.w+140||py<-140||py>view.h+140)return;

 // The wheel centers and radii agree with world-space collision geometry.
 const k=view.ppu/39;ctx.scale(k,k);

 ctx.fillStyle='#17212a';rr(-44,-8,90,11,4);ctx.fill();
 ctx.fillStyle='#1b2934';ctx.beginPath();ctx.moveTo(-48,-3);ctx.lineTo(49,-3);ctx.lineTo(44,3);ctx.lineTo(-45,3);ctx.closePath();ctx.fill();

 ctx.fillStyle=paint;ctx.beginPath();ctx.moveTo(-45,-5);ctx.lineTo(-40,-15+wobble);ctx.lineTo(-18,-17);ctx.quadraticCurveTo(-11,-37,7,-37);ctx.quadraticCurveTo(20,-36,27,-21);ctx.lineTo(43,-14);ctx.quadraticCurveTo(50,-12,51,-6);ctx.lineTo(45,-3);ctx.lineTo(-43,-3);ctx.closePath();ctx.fill();
 // Blue-tinted glass roof and slim windshield.
 ctx.fillStyle='#09374e';ctx.beginPath();ctx.moveTo(-12,-18);ctx.quadraticCurveTo(-5,-34,7,-34);ctx.quadraticCurveTo(19,-33,23,-19);ctx.closePath();ctx.fill();
 const glass=ctx.createLinearGradient(-9,-35,22,-18);glass.addColorStop(0,'#80d5ee');glass.addColorStop(1,'#c9ecf7');ctx.fillStyle=glass;ctx.beginPath();ctx.moveTo(-8,-19);ctx.quadraticCurveTo(-2,-31,7,-31);ctx.lineTo(8,-19);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(11,-31);ctx.quadraticCurveTo(17,-30,21,-20);ctx.lineTo(12,-20);ctx.closePath();ctx.fill();
 ctx.strokeStyle='#e6faff';ctx.globalAlpha=.6;ctx.lineWidth=1.15;line(-33,-14,23,-16);ctx.globalAlpha=1;
 ctx.fillStyle='#0d345a';ctx.beginPath();ctx.moveTo(-47,-12);ctx.lineTo(-36,-13);ctx.lineTo(-38,-18);ctx.lineTo(-48,-18);ctx.closePath();ctx.fill();
 ctx.fillStyle='#f6e6ab';rr(44,-10,7,3,1.3);ctx.fill();ctx.fillStyle='#af3841';rr(-49,-10,6,4,1.3);ctx.fill();
 // Side vent and a thin rear spoiler.
 ctx.fillStyle='#193b5c';rr(28,-12,11,4,1);ctx.fill();ctx.fillStyle='#0b1f36';rr(-43,-21,17,3,1);ctx.fill();
 for(const [i,side] of [-1,1].entries()){
  const wx=side*AXLE*39,compression=car.susp[i]*5;

function debrisDust(){for(const p of particles){ctx.save();ctx.globalAlpha=clamp(p.life/.95,0,1);ctx.fillStyle=p.kind==='junk'?'#ad9378':'#bbcbd0';ctx.beginPath();ctx.arc(X(p.x),Y(p.y),clamp(U(p.r),1.8,6.3),0,2*PI);ctx.fill();ctx.restore();}}
function contactShadow(){

// Persistent personal-best flag anchored to the world coordinate where that
// distance was achieved. The pole sits on the physical junkyard surface.

 if(px < -95||px > view.w+95||groundY < -130||groundY > view.h+135)return;

 ctx.strokeStyle='#f7f3d9';ctx.lineWidth=1.6;line(px+1.5,groundY-3,px+1.5,topY+4);

 ctx.beginPath();ctx.moveTo(px+1,topY);ctx.lineTo(px+85,topY);ctx.lineTo(px+98,topY+19);ctx.lineTo(px+85,topY+38);ctx.lineTo(px+1,topY+38);ctx.closePath();ctx.fill();ctx.stroke();

 ctx.font='900 11px system-ui,sans-serif';ctx.fillText('BEST',px+46,topY+12);

 ctx.restore();
}
function endLabel(){if(state!=='rest'||score==null)return;const px=X(car.x),py=Y(car.y)-79;if(px<30||px>view.w-30||py<40||py>view.h-30)return;ctx.save();ctx.fillStyle='#173b52';rr(px-58,py-20,116,30,8);ctx.fill();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='850 13px system-ui,sans-serif';ctx.fillText(score.toFixed(2)+' ft',px,py);ctx.restore();}
function render(){
 if(!view.w||!view.h)return;ctx.clearRect(0,0,view.w,view.h);sky();

}
function resize(){
 const r=box.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);view.w=Math.max(300,r.width);view.h=Math.max(320,r.height);
 canvas.width=Math.round(view.w*dpr);canvas.height=Math.round(view.h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);

}
function tick(t){const dt=lastTime?Math.min(.045,(t-lastTime)/1000):0;lastTime=t;if(!document.hidden)update(dt);render();requestAnimationFrame(tick);}
let typingTimer=null;
field.addEventListener('input',()=>{clearTimeout(typingTimer);typingTimer=setTimeout(()=>refresh(true),185);});

window.__graphLaunchStep=(dt)=>update(Math.min(.04,Math.max(0,dt)));
